name: public-collect
# 備援採集：Mac 休眠或 token 失效時，由 GitHub Actions 續命公開源資料（⑦ 大單流仍需 Mac）
# 每 10 分鐘跑一次 → force-push 單 commit 到 data 分支 → 頁面從 raw 讀 market_public.json
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-collect
  cancel-in-progress: true
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: run public collector (stdlib only)
        run: python3 market_export.py --public-out market_public.json
      - name: force-push data branch (history stays 1 commit)
        run: |
          git config user.name "actions-public"
          git config user.email "actions@users.noreply.github.com"
          cp market_public.json /tmp/market_public.json
          git checkout --orphan datatmp
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -maxdepth 1 ! -name . ! -name .git -exec rm -rf {} + 2>/dev/null || true
          cp /tmp/market_public.json market_public.json
          git add market_public.json
          git commit -m "public data $(date -u +%FT%TZ)"
          git push -f origin datatmp:data
